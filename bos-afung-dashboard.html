const StatusPill = ({ status }) => {
  const config = {
    on_time: { bg: 'rgba(115, 165, 128, 0.15)', color: colors.sageDark, label: 'On Time' },
    late: { bg: 'rgba(230, 168, 23, 0.15)', color: colors.amber, label: 'Late' },
    absent: { bg: 'rgba(184, 58, 42, 0.15)', color: colors.brick, label: 'Absent' },
  }[status] || {};
  return <span className="text-[10px] sm:text-xs px-2 py-0.5 rounded font-medium" style={{ background: config.bg, color: config.color }}>{config.label}</span>;
};

const SeverityPill = ({ severity }) => {
  const config = {
    high: { bg: colors.brick, label: 'HIGH' },
    medium: { bg: colors.amber, label: 'MEDIUM' },
    low: { bg: colors.muted, label: 'LOW' },
  }[severity];
  return <span className="text-[10px] px-2 py-0.5 rounded font-bold" style={{ background: config.bg, color: colors.white }}>{config.label}</span>;
};

const ScoreBadge = ({ score, size = 'md' }) => {
  const config = score >= 85 ? { bg: 'rgba(115, 165, 128, 0.15)', color: colors.sageDark, label: 'Excellent' }
    : score >= 70 ? { bg: 'rgba(15, 76, 92, 0.10)', color: colors.primary, label: 'Good' }
    : score >= 55 ? { bg: 'rgba(230, 168, 23, 0.15)', color: colors.amber, label: 'Fair' }
    : { bg: 'rgba(184, 58, 42, 0.15)', color: colors.brick, label: 'Poor' };
  return (
    <div className={`inline-flex items-center gap-1.5 rounded-md font-semibold ${size === 'sm' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'}`}
         style={{ background: config.bg, color: config.color }}>
      {score}<span style={{ opacity: 0.7 }}>· {config.label}</span>
    </div>
  );
};

// ─── MAIN APP ───

function BosAfungDashboard() {
  const [page, setPage] = useState('dashboard');

  const pageTitles = {
    dashboard: 'Dashboard',
    attendance: 'Attendance Log',
    incidents: 'Incidents',
    feedback: 'Customer Feedback',
    anomaly: 'Anomaly Flags',
    karyawan: 'Karyawan',
    reports: 'Reports',
    settings: 'Settings',
  };

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <DashboardPage />;
      case 'attendance': return <AttendancePage />;
      case 'incidents': return <IncidentsPage />;
      case 'feedback': return <FeedbackPage />;
      case 'anomaly': return <AnomalyPage />;
      case 'karyawan': return <KaryawanPage />;
      case 'reports': return <PlaceholderPage title="Reports" />;
      case 'settings': return <PlaceholderPage title="Settings" />;
      default: return <DashboardPage />;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden" style={{ background: colors.sand }}>
      <DesktopSidebar currentPage={page} setPage={setPage} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <TopBar pageTitle={pageTitles[page]} onMenuClick={() => setPage('dashboard')} />
        <div className="flex-1 overflow-y-auto">{renderPage()}</div>
      </div>
      <MobileBottomNav currentPage={page} setPage={setPage} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BosAfungDashboard />);
