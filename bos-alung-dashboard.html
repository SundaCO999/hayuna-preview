const makeIcon = (iconName) => {
  return ({ size = 18, className = '', style = {}, strokeWidth = 2, ...rest }) => {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current && window.lucide) {
        ref.current.innerHTML = '';
        const svg = window.lucide.createElement(window.lucide[iconName] || window.lucide.HelpCircle);
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke-width', strokeWidth);
        ref.current.appendChild(svg);
      }
    }, [size, strokeWidth]);
    return <span ref={ref} className={className} style={{ display: 'inline-flex', color: style.color || 'currentColor', ...style }} {...rest} />;
  };
};

const KaryawanDetailPage = ({ karyawan, setPage }) => {
  if (!karyawan) return <div className="p-8">Pilih karyawan dari daftar</div>;
  
  // Bobot HEXACO per posisi (sesuai concept v2)
  // Kasir: H 35%, C 30%, X 10%, A 10%, O 8%, E 7%
  // Server: X 25%, A 25%, C 25%, H 15%, O 5%, E 5%
  // Cook Helper: C 30%, A 25%, H 20%, X 10%, O 10%, E 5%
  // Head Chef: C 25%, H 25%, O 20%, A 15%, X 10%, E 5%
  // Default (Captain, Supervisor, dll): C 25%, H 20%, A 20%, X 15%, O 15%, E 5%
  const getWeights = (posisi) => {
    const p = (posisi || '').toLowerCase();
    if (p.includes('kasir')) return { H: 35, C: 30, X: 10, A: 10, O: 8, E: 7 };
    if (p.includes('server')) return { X: 25, A: 25, C: 25, H: 15, O: 5, E: 5 };
    if (p.includes('cook helper') || p.includes('cook') && p.includes('helper')) return { C: 30, A: 25, H: 20, X: 10, O: 10, E: 5 };
    if (p.includes('head chef') || p.includes('head cook')) return { C: 25, H: 25, O: 20, A: 15, X: 10, E: 5 };
    return { C: 25, H: 20, A: 20, X: 15, O: 15, E: 5 };
  };
  const w = getWeights(karyawan.posisi);
  
  // Skor per dimensi (variasi dari composite untuk visual demo)
  const base = karyawan.score;
  const dimensiScore = [
    { code: 'H', label: 'Honesty-Humility', score: Math.min(95, base + 4), weight: w.H, priority: w.H >= 25 },
    { code: 'E', label: 'Emotionality', score: Math.max(40, base - 13), weight: w.E, priority: false },
    { code: 'X', label: 'Extraversion', score: base + 2, weight: w.X, priority: w.X >= 25 },
    { code: 'A', label: 'Agreeableness', score: base - 1, weight: w.A, priority: w.A >= 25 },
    { code: 'C', label: 'Conscientiousness', score: Math.min(95, base + 7), weight: w.C, priority: w.C >= 25 },
    { code: 'O', label: 'Openness', score: base - 5, weight: w.O, priority: w.O >= 20 },
  ];
  
  return (
    <div className="p-4 sm:p-6 lg:p-8 space-y-4 sm:space-y-6 pb-24 lg:pb-8">
      <button className="hidden lg:flex text-sm items-center gap-1 hover:underline" onClick={() => setPage('karyawan')} style={{ color: colors.primary }}>← Kembali ke Daftar</button>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <div className="lg:col-span-1 p-4 sm:p-6 rounded-xl border" style={{ background: colors.white, borderColor: colors.border }}>

            <Avatar initials={karyawan.avatar} size="lg" />
            <h2 className="text-lg font-semibold mt-3" style={{ color: colors.text, fontFamily: 'Sora, sans-serif' }}>{karyawan.nama}</h2>

            <div className="mt-3"><StatusPill status={karyawan.status} /></div>
          </div>
          <div className="pt-4 sm:pt-6 space-y-3 text-sm">
            <div className="flex justify-between"><span style={{ color: colors.muted }}>Posisi</span><span style={{ color: colors.text, fontWeight: 500 }}>{karyawan.posisi}</span></div>
            <div className="flex justify-between"><span style={{ color: colors.muted }}>Divisi</span><span style={{ color: colors.text, fontWeight: 500 }}>{karyawan.divisi}</span></div>
            <div className="flex justify-between"><span style={{ color: colors.muted }}>Outlet</span><span style={{ color: colors.text, fontWeight: 500 }}>{karyawan.outlet}</span></div>
            <div className="flex justify-between"><span style={{ color: colors.muted }}>Masa Kerja</span><span style={{ color: colors.text, fontWeight: 500 }}>{karyawan.masaKerja} bulan</span></div>

            <MessageSquare size={14} /> Lihat Riwayat Chat

        <div className="lg:col-span-2 space-y-4 sm:space-y-6">

              <div className="flex items-start justify-between mb-2 gap-2 flex-wrap">

function BosAlungDashboard() {
  const [page, setPage] = useState('dashboard');
  const [selectedKaryawan, setSelectedKaryawan] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);

  const pageTitles = {
    dashboard: 'Dashboard',
    karyawan: 'Karyawan',
    'karyawan-detail': selectedKaryawan ? selectedKaryawan.nama : 'Detail',
    onboarding: 'Onboarding',
    promosi: 'Kandidat Promosi',
    flags: 'Flags & Alerts',
    riset: 'Riset Materi',
    laporan: 'Laporan',
    settings: 'Settings',
  };

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <DashboardPage setPage={setPage} setSelectedKaryawan={setSelectedKaryawan} />;
      case 'karyawan': return <KaryawanPage setPage={setPage} setSelectedKaryawan={setSelectedKaryawan} />;
      case 'karyawan-detail': return <KaryawanDetailPage karyawan={selectedKaryawan} setPage={setPage} />;
      case 'onboarding': return <OnboardingPage />;
      case 'promosi': return <PromosiPage />;
      case 'flags': return <FlagsPage />;
      case 'riset': return <RisetPage />;
      case 'laporan': return <LaporanPage />;
      case 'settings': return <SettingsPage />;
      default: return <DashboardPage setPage={setPage} setSelectedKaryawan={setSelectedKaryawan} />;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden" style={{ background: colors.sand, fontFamily: "'Inter Tight', system-ui, sans-serif" }}>
      <DesktopSidebar currentPage={page} setPage={setPage} />
      <MobileDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} currentPage={page} setPage={setPage} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <TopBar pageTitle={pageTitles[page]} onMenuClick={() => setDrawerOpen(true)} onBack={() => setPage('karyawan')} showBack={page === 'karyawan-detail'} />
        <div className="flex-1 overflow-y-auto">{renderPage()}</div>
      </div>
      <MobileBottomNav currentPage={page} setPage={setPage} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BosAlungDashboard />);
</script>
