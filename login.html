<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Hayuna AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('hy-theme')||''}catch(e){}</script>
</head>
<body>
<div class="mock-banner">MOCKUP — Hayuna AI v2 · data dummy · belum wired ke backend</div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="hayuna-logo" style="width:48px;height:48px;font-size:20px;">H</span>
      <div>
        <div class="auth-title">Selamat datang</div>
        <div class="auth-sub">Hayuna AI · Portal Klien · Demo</div>
      </div>
    </div>

    <button class="btn-google" onclick="location.href='portal.html'">
      <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Lanjut dengan Google
    </button>

    <div class="auth-divider">atau (akses owner)</div>

    <form onsubmit="return false">
      <div class="auth-field">
        <label>Username</label>
        <input type="text" value="hayuna-demo" autocomplete="username">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" value="hayuna123" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block btn-lg" onclick="location.href='portal.html'" style="margin-top:6px;">Masuk</button>
    </form>

    <div class="auth-note">
      Belum punya akun? <strong>Langsung masuk aja</strong> — akun otomatis kebikin pas pertama masuk. Bisa Google, bisa email + password.<br>
      <span class="badge badge-gray" style="margin-top:8px;">Demo: hayuna-demo / hayuna123</span>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
